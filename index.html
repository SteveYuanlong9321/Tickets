<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0a10">
  <meta name="description" content="Tickets · 我的设备，我的票">
  <meta name="site-build" content="2026-10-06">
  <title>Tickets · 我的设备，我的票</title>
  <link rel="stylesheet" href="style.css?v=7.0.0-20261006">
</head>
<body>
  <main class="page-shell">
    <header class="site-header">
      <a class="brand" href="./index.html" aria-label="Tickets 首页">Tickets</a>
      <span class="version-pill">7.0.0</span>
    </header>

    <section class="hero">
      <div class="eyebrow">TICKETS</div>
      <h1>我的设备，<span>我的票</span></h1>
      <p class="hero-copy">
        把票据留在自己的设备里。需要接收一张票时，使用 App 扫描分享入口即可继续。
      </p>

      <div class="hero-ticket-wrap" aria-label="电子票根示意">
        <article class="ticket-stub">
          <div class="ticket-main">
            <div class="ticket-topline">
              <span class="ticket-type">电子票根</span>
              <span class="ticket-status">READY</span>
            </div>

            <h2>周末演出</h2>

            <div class="ticket-route">
              <div>
                <span>时间</span>
                <strong>19:30</strong>
              </div>
              <div>
                <span>座位</span>
                <strong>A-18</strong>
              </div>
              <div>
                <span>入口</span>
                <strong>Gate 3</strong>
              </div>
            </div>

            <div class="ticket-divider"><span></span></div>

            <div class="ticket-footer">
              <span>Tickets</span>
              <span>LOCAL</span>
            </div>
          </div>

          <div class="ticket-edge" aria-hidden="true"></div>
        </article>
      </div>

      <div class="actions">
        <a class="primary-button" href="./ticket.html?t=DEMO-001&amp;sig=demo">
          <span>扫码收票</span>
          <span class="button-arrow">↗</span>
        </a>

        <a class="release-badge" href="https://github.com/SteveYuanlong9321/Tickets-App/releases" target="_blank" rel="noopener noreferrer" aria-label="Download from GitHub Releases">
          <img class="release-badge-image" src="./assets/github-releases-badge.webp" alt="Download on GitHub Releases">
        </a>
      </div>
    </section>

    <section class="feature-strip" aria-label="产品特点">
      <div>
        <span class="feature-kicker">LOCAL</span>
        <strong>票据留在设备</strong>
        <p>以本地数据管理为核心，票据默认保存在设备本地。</p>
      </div>
      <div>
        <span class="feature-kicker">RECEIVE</span>
        <strong>扫码接收</strong>
        <p>通过 Tickets 的分享入口打开接收页面，再交由 App 继续处理。</p>
      </div>
      <div>
        <span class="feature-kicker">OPEN</span>
        <strong>开源路线</strong>
        <p>项目源码、发布版本和后续 F-Droid 计划都会集中在这里。</p>
      </div>
    </section>

    <footer class="site-footer">
      <span>Tickets · 7.0.0</span>
      <a href="https://github.com/SteveYuanlong9321/Tickets-App" rel="noopener">GitHub</a>
    </footer>
  </main>
</body>
</html>
