name: Update NYC GTFS Patterns

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: write

concurrency:
  group: tickets-nyc-gtfs-patterns
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build NYC official GTFS pattern data
        run: python scripts/build_nyc_gtfs_patterns.py

      - name: Commit changed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/nyc-gtfs-patterns.json

          if git diff --cached --quiet; then
            echo "No NYC GTFS pattern changes."
            exit 0
          fi

          git commit -m "data: update NYC official GTFS patterns"
          git pull --rebase origin main
          git push origin HEAD:main
