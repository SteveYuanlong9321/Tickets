name: Publish Tickets F-Droid Repo

on:
  release:
    types: [published]
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/fdroid-repo.yml"
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write

concurrency:
  group: tickets-fdroid-repo
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish F-Droid repository
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check whether F-Droid repository needs updating
        id: update_check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          repo = os.environ["GITHUB_REPOSITORY"]

          raw = subprocess.check_output(
              [
                  "gh",
                  "api",
                  "--paginate",
                  "--slurp",
                  f"repos/{repo}/releases?per_page=100",
              ],
              text=True,
          )

          pages = json.loads(raw)
          releases = [release for page in pages for release in page]
          releases = [
              release
              for release in releases
              if not release.get("draft") and not release.get("prerelease")
          ]

          releases_with_apk = [
              release
              for release in releases
              if any(
                  asset.get("name", "").lower().endswith(".apk")
                  for asset in release.get("assets", [])
              )
          ]

          if not releases_with_apk:
              raise SystemExit("No published GitHub release with an APK was found.")

          latest_tag = releases_with_apk[0]["tag_name"]
          expected_count = len(releases_with_apk)
          expected_main_count = min(3, expected_count)
          expected_archive_count = max(expected_count - 3, 0)

          index_path = Path("fdroid/repo/index-v2.json")
          indexed_versions = []
          index_data = {}
          if index_path.exists():
              try:
                  index_data = json.loads(index_path.read_text(encoding="utf-8"))
                  package = index_data.get("packages", {}).get("com.example.tickets", {})
                  indexed_versions = [
                      version_info.get("manifest", {}).get("versionName")
                      for version_info in package.get("versions", {}).values()
                      if version_info.get("manifest", {}).get("versionName")
                  ]
              except (OSError, json.JSONDecodeError, AttributeError, TypeError):
                  indexed_versions = []

          archive_index_path = Path("fdroid/archive/index-v2.json")
          archived_versions = []
          if archive_index_path.exists():
              try:
                  archive_index_data = json.loads(
                      archive_index_path.read_text(encoding="utf-8")
                  )
                  package = archive_index_data.get("packages", {}).get(
                      "com.example.tickets", {}
                  )
                  archived_versions = [
                      version_info.get("manifest", {}).get("versionName")
                      for version_info in package.get("versions", {}).values()
                      if version_info.get("manifest", {}).get("versionName")
                  ]
              except (OSError, json.JSONDecodeError, AttributeError, TypeError):
                  archived_versions = []

          latest_version = latest_tag[1:] if latest_tag.startswith("v") else latest_tag
          current_count = len(indexed_versions)
          archive_count = len(archived_versions)
          latest_present = latest_version in indexed_versions

          repo_name = ""
          repo_description = ""
          app_name = ""
          if index_path.exists():
              repo_data = index_data.get("repo", {})
              repo_name = repo_data.get("name", "")
              repo_description = repo_data.get("description", "")
              apps = index_data.get("apps", [])
              if apps:
                  app_name = apps[0].get("name", "")

          expected_repo_description = "票据App官方F-Droid仓库，所有该App出现在Github上的的版本都将出现在此"
          archive_ready = (
              archive_count == expected_archive_count
              and (expected_archive_count == 0 or archive_index_path.exists())
          )

          update_needed = (
              current_count != expected_main_count
              or not archive_ready
              or not latest_present
              or not index_path.exists()
              or repo_name != "票据"
              or repo_description != expected_repo_description
              or app_name != "票据"
          )

          print(f"Published releases with APK: {expected_count}")
          print(f"Expected main-repo versions: {expected_main_count}")
          print(f"Indexed F-Droid versions: {current_count}")
          print(f"Expected archive versions: {expected_archive_count}")
          print(f"Indexed archive versions: {archive_count}")
          print(f"Latest GitHub release: {latest_tag}")
          print(f"Latest version present in F-Droid index: {latest_present}")
          print(f"Repo name correct: {repo_name == '票据'}")
          print(f"Repo description correct: {repo_description == expected_repo_description}")
          print(f"App name correct: {app_name == '票据'}")
          print(f"F-Droid update needed: {update_needed}")

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"FDROID_UPDATE_NEEDED={'true' if update_needed else 'false'}\n")
          PY

      - name: Install F-Droid server tools
        if: env.FDROID_UPDATE_NEEDED == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y apksigner pipx
          pipx install fdroidserver
          pipx ensurepath
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Prepare repository
        if: env.FDROID_UPDATE_NEEDED == 'true'
        env:
          FDROID_REPO_SECRET: ${{ secrets.FDROID_REPO_SECRET }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ -z "${FDROID_REPO_SECRET}" ]; then
            echo "FDROID_REPO_SECRET is not configured."
            exit 1
          fi

          python3 - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path

          data = json.loads(os.environ["FDROID_REPO_SECRET"])
          required = ("keystoreBase64", "storePassword")
          missing = [k for k in required if not data.get(k)]
          if missing:
              raise SystemExit("Missing fields in FDROID_REPO_SECRET: " + ", ".join(missing))

          Path("work").mkdir(parents=True, exist_ok=True)
          Path("work/keystore.p12").write_bytes(base64.b64decode(data["keystoreBase64"]))
          PY

          mkdir -p work/fdroid/repo work/fdroid/metadata
          rm -rf work/download
          mkdir -p work/download

          mapfile -t release_tags < <(
            gh release list \
              --repo "$GITHUB_REPOSITORY" \
              --limit 100 \
              --exclude-drafts \
              --exclude-pre-releases \
              --json tagName \
              --jq '.[].tagName'
          )

          if [ "${#release_tags[@]}" -eq 0 ]; then
            echo "No published GitHub releases were found."
            exit 1
          fi

          total_apks=0

          for tag in "${release_tags[@]}"; do
            safe_tag="$(printf '%s' "$tag" | tr -cs 'A-Za-z0-9._-' '_')"
            safe_tag="${safe_tag#_}"
            safe_tag="${safe_tag%_}"
            [ -n "$safe_tag" ] || safe_tag="release-$((total_apks + 1))"

            release_dir="work/download/$safe_tag"
            mkdir -p "$release_dir"

            echo "Collecting APK from release: $tag"

            gh release download "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "*.apk" \
              --dir "$release_dir"

            apk_count="$(find "$release_dir" -maxdepth 1 -type f -name '*.apk' | wc -l)"
            if [ "$apk_count" -ne 1 ]; then
              echo "Expected exactly one APK in release $tag, found $apk_count."
              find "$release_dir" -maxdepth 1 -type f -print
              exit 1
            fi

            apk_file="$(find "$release_dir" -maxdepth 1 -type f -name '*.apk' | head -n1)"
            apk_name="$(basename "$apk_file")"
            cp "$apk_file" "work/fdroid/repo/${safe_tag}-${apk_name}"
            total_apks=$((total_apks + 1))
          done

          echo "Collected $total_apks APK(s) from published GitHub releases."

          mkdir -p work/fdroid/metadata/com.example.tickets/en-US/images
          cp assets/tickets-app-icon.png work/fdroid/metadata/com.example.tickets/en-US/images/icon.png
          mkdir -p work/fdroid/archive/icons
          cp assets/tickets-app-icon.png work/fdroid/archive/icons/tickets-app-icon.png
          cp assets/tickets-app-icon.png work/fdroid/tickets-app-icon.png

          cat > work/fdroid/metadata/com.example.tickets.yml <<'EOF'
          Name: 票据
          Summary: 电子票据管理与设备间传票
          Description: |
            Tickets 是一款 Android 电子票据管理应用。

            用于本地管理车票、机票、演出和门票等电子凭证，并支持设备之间传票。
            当前发布版本保持完整功能，包括用户可选择的设备间传输连接方式以及实时通知功能。

            官方项目：
            https://github.com/SteveYuanlong9321/Tickets
          WebSite: https://steveyuanlong9321.github.io/Tickets/
          SourceCode: https://github.com/SteveYuanlong9321/Tickets
          IssueTracker: https://github.com/SteveYuanlong9321/Tickets/issues
          AuthorName: SteveYuanlong9321
          Categories:
            - Travel & Local
          EOF

          cat > work/fdroid/config.yml <<'EOF'
          repo_url: https://steveyuanlong9321.github.io/Tickets/fdroid/repo
          repo_name: 票据
          repo_icon: tickets-app-icon.png
          repo_description: 票据App官方F-Droid仓库，所有该App出现在Github上的的版本都将出现在此
          archive_url: https://steveyuanlong9321.github.io/Tickets/fdroid/archive
          archive_name: Tickets 历史版本
          archive_description: Tickets 官方 F-Droid 历史版本仓库
          archive_icon: tickets-app-icon.png
          archive_older: 3
          keystore: keystore.p12
          repo_keyalias: repokey
          EOF

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          data = json.loads(os.environ["FDROID_REPO_SECRET"])
          cfg = Path("work/fdroid/config.yml")
          text = cfg.read_text(encoding="utf-8")
          text += "\nkeystorepass: " + data["storePassword"] + "\n"
          text += "keypass: " + data["storePassword"] + "\n"
          text += 'keydname: "CN=Tickets F-Droid Repo, O=Tickets, C=US"\n'
          cfg.write_text(text, encoding="utf-8")
          PY

          cp work/keystore.p12 work/fdroid/keystore.p12
          chmod 600 work/fdroid/config.yml work/fdroid/keystore.p12

      - name: Generate repository index
        if: env.FDROID_UPDATE_NEEDED == 'true'
        working-directory: work/fdroid
        run: |
          fdroid update --create-metadata --verbose

      - name: Validate repository index consistency
        if: env.FDROID_UPDATE_NEEDED == 'true'
        working-directory: work/fdroid
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          for section in ("repo", "archive"):
              root = Path(section)
              index_path = root / "index-v2.json"
              entry_path = root / "entry.json"

              index = json.loads(index_path.read_text(encoding="utf-8"))
              entry = json.loads(entry_path.read_text(encoding="utf-8"))

              repo_timestamp = index.get("repo", {}).get("timestamp")
              entry_timestamp = entry.get("timestamp")
              if repo_timestamp != entry_timestamp:
                  raise SystemExit(
                      f"{section}: timestamp mismatch: index={repo_timestamp}, entry={entry_timestamp}"
                  )

              raw = index_path.read_bytes()
              actual_sha = hashlib.sha256(raw).hexdigest()
              actual_size = len(raw)
              declared = entry.get("index", {})

              if declared.get("sha256") != actual_sha:
                  raise SystemExit(
                      f"{section}: index SHA-256 mismatch: entry={declared.get('sha256')}, actual={actual_sha}"
                  )
              if declared.get("size") != actual_size:
                  raise SystemExit(
                      f"{section}: index size mismatch: entry={declared.get('size')}, actual={actual_size}"
                  )

              for timestamp, diff_info in entry.get("diffs", {}).items():
                  diff_path = root / diff_info["name"].lstrip("/")
                  if not diff_path.is_file():
                      raise SystemExit(
                          f"{section}: missing diff file for source timestamp {timestamp}: {diff_path}"
                      )

          print("F-Droid repo and archive index timestamps/hashes are internally consistent.")
          PY

      - name: Publish F-Droid repository to GitHub Pages
        if: env.FDROID_UPDATE_NEEDED == 'true'
        run: |
          set -euo pipefail

          mkdir -p fdroid/repo fdroid/archive fdroid/metadata
          rm -rf fdroid/repo/*
          rm -rf fdroid/archive/*
          rm -rf fdroid/metadata/*

          cp -R work/fdroid/repo/. fdroid/repo/
          if [ -d work/fdroid/archive ]; then
            cp -R work/fdroid/archive/. fdroid/archive/
          fi
          cp -R work/fdroid/metadata/. fdroid/metadata/

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add fdroid/repo fdroid/archive fdroid/metadata
          if git diff --cached --quiet; then
            echo "No F-Droid repository changes to publish."
            exit 0
          fi

          git commit -m "Update Tickets F-Droid repository"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Clean signing material
        if: always()
        run: |
          rm -rf work
